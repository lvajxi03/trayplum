name: Build

on:
  push:
    branches:
      - bugfix/build

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild TrayPlum.vcxproj -t:rebuild -verbosity:diag -property:Configuration=Release
    - name: Find artifacts
      run: dir /s TrayPlum.exe
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: helik-dist
        path: |
          TrayPlum\Release\TrayPlum.exe

