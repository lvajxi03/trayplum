name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@v4
    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild TrayPlum.vcxproj -t:rebuild -verbosity:diag -property:Configuration=Release
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trayplum-demo
        path: |
          Release\TrayPlum.exe

